# OrderEZ Supplier Portal · Nginx 站点配置（前端容器内）
#
# 职责：
#   1. 托管 Vue 打包产物，SPA 路由回退到 index.html
#   2. 把 /api 反代到 backend 容器
#   3. 静态资源长缓存、index.html 不缓存，避免升级后浏览器拿到旧壳

upstream orderez_backend {
    server backend:3100;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 报表导出走 POST body，默认 1m 够用；留出余量
    client_max_body_size 8m;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头（HTTPS 终结在反代上时，HSTS 建议在那层加）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://orderez_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Excel 导出与同步请求可能偏慢
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 缓存策略一律用 `expires`，不用 `add_header Cache-Control`：
    # nginx 里只要某个 location 自己写了 add_header，上层（server 级）的
    # 安全响应头就不会再继承下来，用 expires 可以只调缓存又不动那三个头。

    # 带内容哈希的构建产物可以长期缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 图标等固定文件名资源：短缓存，换 logo 后不至于长期不生效
    location ~* \.(svg|png|ico|webp)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 应用外壳不缓存，刷新即拿到最新版本
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
